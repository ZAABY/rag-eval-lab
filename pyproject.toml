[project]
name = "rag-eval-lab"
version = "0.1.0"
description = "Retrieval and LLM-judge reliability evaluation on SQuAD v2, CPU-only"
requires-python = ">=3.10"
dependencies = ["numpy", "rank-bm25", "fastembed", "huggingface_hub", "llama-cpp-python"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
